<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你最吸引哪个城市？</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef8ff;color:#243746}main{max-width:680px;margin:0 auto;padding:24px 16px 40px}.panel{background:white;border:1px solid #d7eaf5;border-radius:24px;padding:26px;box-shadow:0 8px 30px #b8d9e833}h1{font-size:30px;text-align:center;margin:8px 0 12px}p{text-align:center;line-height:1.7;color:#607889}.small{font-size:13px}.hidden{display:none!important}.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin:12px 0;background:#d9efff;color:#24495e;font-size:16px;cursor:pointer}.btn:hover{background:#bfe4fb}.btn:active{transform:scale(.99)}.primary{background:#86c9f1;color:#12354a;font-weight:700}.primary:hover{background:#6db9e7}.choice{text-align:left;background:#f5fbff;border:1px solid #d6eaf5}.choice.selected{background:#9bd5f5;border-color:#5aaedc}.top{display:flex;justify-content:space-between;color:#668294;font-size:14px;margin-bottom:12px}.bar{height:8px;background:#e6f1f7;border-radius:99px;overflow:hidden;margin-bottom:24px}.fill{height:100%;background:#8acdf1;width:0}.result{text-align:center}.city{font-size:34px;font-weight:800;color:#3188b7;margin:16px 0}.tag{display:inline-block;background:#e6f6ff;border-radius:99px;padding:8px 14px;color:#3188b7}.footer{text-align:center;font-size:12px;color:#8aa0ad;margin-top:18px}
</style>
</head>
<body>
<main>
<section id="start" class="panel">
<h1>你最吸引哪个城市？</h1>
<p>30道小测试，看看你的气质与哪座中国城市最有缘。</p>
<button id="startBtn" class="btn primary">开始测试</button>
<div class="footer">淡蓝色城市性格测试</div>
</section>
<section id="quiz" class="panel hidden">
<div class="top"><span id="counter">第 1 / 30 题</span><span id="percent">0%</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<h2 id="question"></h2>
<div id="choices"></div>
<button id="nextBtn" class="btn primary" disabled>下一题</button>
</section>
<section id="result" class="panel hidden result">
<p>你的城市气质是</p><div id="city" class="city"></div><div id="description"></div>
<button id="againBtn" class="btn primary">再测一次</button>
</section>
</main>
<script>
(function(){
const questions=[
"周末突然空下来，你会？","你更喜欢哪种天气？","旅行时你最在意？","朋友通常觉得你？","你喜欢的生活节奏？","遇到陌生人时你会？","你更喜欢哪种空间？","你的理想夜晚是？","你买东西最看重？","你更像哪种颜色？","面对压力你会？","你喜欢怎样的街道？","你做决定靠什么？","你更喜欢哪种美食？","你希望别人记住你的？","你喜欢的旅行方式？","你对新鲜事物的态度？","你更喜欢哪种音乐？","你的房间风格？","你最向往的生活？","朋友找你倾诉时你会？","你喜欢怎样的天气变化？","你更看重自由还是稳定？","你喜欢的拍照氛围？","你做事的风格？","你更喜欢白天还是夜晚？","你理想中的城市声音？","你遇到选择时？","你最想拥有的能力？","哪句话最像你？"
];
const options=["去街上随便逛逛","待在家里享受独处","约朋友吃饭聊天","立刻安排一次小旅行"];
const cities=["成都","重庆","北京","上海","广州","深圳","杭州","南京","苏州","西安","厦门","青岛","大理","昆明","长沙","武汉","福州","泉州","珠海","海口","哈尔滨","沈阳","天津","洛阳","乌鲁木齐"];
const desc=["松弛、温柔又有自己的节奏。","热烈、直接，拥有很强的生命力。","独立、有目标，气场很鲜明。","精致、敏锐，重视生活质感。","开朗、有行动力，喜欢热闹。"];
let index=0,answers=[];
const $=id=>document.getElementById(id);
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function render(){
$("counter").textContent=`第 ${index+1} / ${questions.length} 题`;
$("percent").textContent=Math.round(index/questions.length*100)+"%";
$("fill").style.width=(index/questions.length*100)+"%";
$("question").textContent=questions[index];
$("choices").innerHTML="";
options.forEach((text,i)=>{const b=document.createElement("button");b.type="button";b.className="btn choice";b.textContent=text;b.addEventListener("click",()=>{answers[index]=i;Array.from($("choices").children).forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("nextBtn").disabled=false;});$("choices").appendChild(b);});
$("nextBtn").disabled=answers[index]===undefined;
$("nextBtn").textContent=index===questions.length-1?"查看测试结果":"下一题";
}
function finish(){let total=answers.reduce((a,b)=>a+b,0);let city=cities[(total*7+answers.length*3)%cities.length];$("city").textContent=city;$("description").innerHTML=`<span class="tag">你的专属城市</span><p>${desc[total%desc.length]}<br>这座城市的气质，和你有一种特别的呼应。</p>`;show("result");}
$("startBtn").addEventListener("click",()=>{index=0;answers=[];show("quiz");render();});
$("nextBtn").addEventListener("click",()=>{if(answers[index]===undefined)return;if(index===questions.length-1)finish();else{index++;render();}});
$("againBtn").addEventListener("click",()=>{index=0;answers=[];show("quiz");render();});
})();
</script>
</body>
</html>
